[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model"
description = "vLLM model wrapper for batched prompt management and execution."
readme = "README.md"
version = "2.1.0"
requires-python = ">=3.10"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.1.0",
    "vllm>=0.9.0",
    "torch",
    "pandas",
    "pydantic>=2",
    "pyyaml"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["model"]

[tool.setuptools.package-dir]
"model" = "src"
# `pytest` without arguments runs every *Test.py file in src/ (pytest's
# default would only collect test_*.py and *_test.py files)
[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*Test.py"]
