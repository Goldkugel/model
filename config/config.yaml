logger:
  folder: "./data/logs/"
  file_name: "output.log"
  header_char: "-"
  header_length: 60
  log_runtime: True
  format: "%Y-%m-%d %H:%M:%S"
  encoding: "utf-8"
llm:
  model_id:
    - "google/medgemma-4b-it"
  device: "cuda"
  expert_parallel_models:
    - "Qwen3-30B"
  seed: 2898231092
  temperature: 0.01
  top_p: 0.95
  max_model_len: 8192
  max_num_batched_tokens: 16384
  max_tokens: 2048
  chunk_size: 500
  prompt_tmp_folder: "./data/tmp/"
  prompt_tmp_file: "prompts_raw.tmp"
  prompt_log_folder: "./data/logs/"
  prompt_log_file: "prompts.log"
  prompt_folder: "./prompts/"
  prompt_files:
    - "mapping.md"
